name: Mission Barns
description: >-
  Mission Barns is a Berkeley, California cultivated-meat company founded in 2018 that grows
  real animal fat from cells to make animal-friendly pork products — including meatballs, bacon,
  pepperoni, chorizo, and sausage — built on Mission Fat, its proprietary cultivated pork fat.
  It is the first company to receive both FDA and USDA clearance for cultivated fat and operates
  a dual B2C consumer-brand and B2B ingredient / co-development model across foodservice and CPG
  partners. This API Evangelist profile is a portfolio-company lead (backed by Point Nine); the
  company runs a consumer marketing site and publishes no public API, developer portal, or
  technical documentation as of this enrichment pass.
